<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetworkLab — Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body class="login-page">
    <div class="login-card">
        <div class="login-header">
            <h1>🛡️ NetworkLab</h1>
            <p>Control de Acceso, Tiempo de Conexión y Filtrado Web</p>
        </div>

        <form id="form-login" class="login-form">
            <div class="form-group">
                <label for="input-usuario">Usuario</label>
                <input 
                    type="text" 
                    id="input-usuario" 
                    class="input-texto" 
                    placeholder="Ingresa tu usuario (ej: admin o alumno1)" 
                    required 
                    autocomplete="username"
                />
            </div>

            <div class="form-group">
                <label for="input-clave">Contraseña</label>
                <input 
                    type="password" 
                    id="input-clave" 
                    class="input-texto" 
                    placeholder="••••••••" 
                    required 
                    autocomplete="current-password"
                />
            </div>

            <p id="mensaje-error" style="color: var(--color-rojo); font-size: 0.85rem; margin: 4px 0 0; display: none; text-align: center;"></p>

            <button type="submit" id="btn-login" class="btn btn-primary btn-login">
                Ingresar al Sistema
            </button>
        </form>

        <div class="demo-credentials">
            <strong>Credenciales por defecto del laboratorio:</strong><br />
            • Administrador: <code>admin</code> / <code>admin123</code><br />
            • Alumno / PC: <code>alumno1</code> / <code>alumno123</code>
        </div>
    </div>

    <script src="login.js"></script>
</body>

</html>
